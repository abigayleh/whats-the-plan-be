name: Auto Testing
on:
  schedule:
    - cron: '55 13 * * *'
  workflow_dispatch:
    inputs:
      sentry_issue_id:
        description: Sentry issue ID to fix now (blank = poll for new issues)
        required: false
jobs:
  autofix:
    # The reusable workflow pushes a fix branch and opens a PR; a called workflow
    # can never hold more token permission than its caller grants here.
    permissions:
      contents: write
      pull-requests: write
    uses: abigayleh/auto-testing/.github/workflows/autofix.yml@main
    with:
      sentry_project: whats-the-plan
      base_branch: master
      sentry_issue_id: ${{ inputs.sentry_issue_id }}
    secrets: inherit
